name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  conformance:
    name: conformance vs Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The shared corpus is the contract with the Python reference
      # implementation; this runs it against the released PyPI package.
      - run: uv run --with zarr-metadata --no-project python scripts/check_conformance.py
